# The proposal form applies `awaiting triage` by itself, and blank issues are
# disabled, so an unlabelled issue should not normally arrive at all. This exists
# for the routes that bypass the chooser — the API, `gh issue create`, an
# integration — where an issue can still land with no label and nothing marking it
# as waiting for anyone. A contributor with read access cannot apply one by hand.
# The label is defined in BitcreditProtocol/.github's labels.yml.
#
# Nothing from the issue is interpolated into a shell command. This workflow runs
# with `issues: write` on an event any GitHub user can raise, so the only value it
# passes is the issue number, and it passes it through the environment rather than
# into the command line.
name: Label untriaged issues

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    name: Add awaiting triage to an issue that arrived with none
    if: join(github.event.issue.labels.*.name, '') == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Add the label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          jq -n '{labels: ["awaiting triage"]}' \
            | gh api -X POST "repos/$REPO/issues/$NUMBER/labels" --input - \
                --jq '.[].name'
