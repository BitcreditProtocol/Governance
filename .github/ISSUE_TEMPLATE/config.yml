# Exactly one route into this repository, and it is the proposal form.
#
# `blank_issues_enabled: false` removes "Open a blank issue", and there are no
# contact links, so the chooser offers Proposal and nothing else. Both differ
# from the organisation default in BitcreditProtocol/.github deliberately: a
# repository that carries its own .github/ISSUE_TEMPLATE stops using the
# organisation's templates and its contact links, and here that is the point.
# Owner decision 2026-09-01.
#
# Nothing is lost by dropping the security contact link. `SECURITY.md` is still
# inherited here, the Security tab still offers "Report a vulnerability", and the
# private advisory route is unchanged — the link was a shortcut, not the route.
blank_issues_enabled: false
